<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffaf0">
    <title>Admin dashboard | CHOWK NEWS</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/admin.css">
    <link rel="stylesheet" href="/inline-feedback.css">
    <script src="/category-icons.js" defer></script>
    <script src="/inline-feedback.js" defer></script>
    <script src="/admin-dashboard.js" defer></script>
  </head>
  <body class="admin-dashboard-body">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <a class="admin-brand sidebar-brand" href="/admin/dashboard" aria-label="Chowk admin overview">
          <span class="admin-brand-mark">C</span>
          <span class="admin-brand-name">CHOWK<span>.</span><small>ADMIN CONSOLE</small></span>
        </a>
        <nav class="admin-nav" aria-label="Admin dashboard">
          <div class="admin-nav-group">
            <div class="admin-nav-heading">WORKSPACE</div>
            <button class="admin-nav-item is-active" type="button" data-section="overview"><span class="admin-nav-icon" aria-hidden="true">◫</span><span class="admin-nav-label">Overview</span></button>
          </div>
          <div class="admin-nav-group">
            <div class="admin-nav-heading">CONTENT</div>
            <button class="admin-nav-item" type="button" data-section="articles"><span class="admin-nav-icon" aria-hidden="true">▤</span><span class="admin-nav-label">Articles</span></button>
            <button class="admin-nav-item" type="button" data-section="categories"><span class="admin-nav-icon" aria-hidden="true">◈</span><span class="admin-nav-label">Categories</span></button>
            <button class="admin-nav-item" type="button" data-section="media"><span class="admin-nav-icon" aria-hidden="true">▧</span><span class="admin-nav-label">Media library</span></button>
            <button class="admin-nav-item" type="button" data-section="live-streams"><span class="admin-nav-icon" aria-hidden="true">◉</span><span class="admin-nav-label">Live streams</span></button>
            <button class="admin-nav-item" type="button" data-section="comments"><span class="admin-nav-icon" aria-hidden="true">☷</span><span class="admin-nav-label">Comments</span></button>
            <button class="admin-nav-item" type="button" data-section="reports"><span class="admin-nav-icon" aria-hidden="true">⚑</span><span class="admin-nav-label">Article reports</span></button>
          </div>
          <div class="admin-nav-group">
            <div class="admin-nav-heading">PEOPLE</div>
            <button class="admin-nav-item" type="button" data-section="applications"><span class="admin-nav-icon" aria-hidden="true">✎</span><span class="admin-nav-label">Applications</span></button>
            <button class="admin-nav-item" type="button" data-section="directory"><span class="admin-nav-icon" aria-hidden="true">♙</span><span class="admin-nav-label">Directory</span></button>
            <button class="admin-nav-item" type="button" data-section="staff-roles"><span class="admin-nav-icon" aria-hidden="true">▦</span><span class="admin-nav-label">Staff job roles</span></button>
            <button class="admin-nav-item" type="button" data-section="agreements"><span class="admin-nav-icon" aria-hidden="true">▤</span><span class="admin-nav-label">Agreements</span></button>
            <button class="admin-nav-item" type="button" data-section="credentials"><span class="admin-nav-icon" aria-hidden="true">▣</span><span class="admin-nav-label">Credentials</span></button>
            <button class="admin-nav-item" type="button" data-section="coverage"><span class="admin-nav-icon" aria-hidden="true">⌖</span><span class="admin-nav-label">Coverage assignments</span></button>
          </div>
          <div class="admin-nav-group">
            <div class="admin-nav-heading">SYSTEM CONFIGURATION</div>
            <button class="admin-nav-item" type="button" data-section="locations"><span class="admin-nav-icon" aria-hidden="true">⌖</span><span class="admin-nav-label">Locations</span></button>
            <button class="admin-nav-item" type="button" data-section="reporter-configuration"><span class="admin-nav-icon" aria-hidden="true">⚑</span><span class="admin-nav-label">System configuration</span></button>
          </div>
          <div class="admin-nav-group">
            <div class="admin-nav-heading">ADMINISTRATION</div>
            <button class="admin-nav-item" type="button" data-section="accounts"><span class="admin-nav-icon" aria-hidden="true">♙</span><span class="admin-nav-label">Accounts</span></button>
            <button class="admin-nav-item" type="button" data-section="audit-logs"><span class="admin-nav-icon" aria-hidden="true">◷</span><span class="admin-nav-label">Audit log</span></button>
            <button class="admin-nav-item" type="button" data-section="settings"><span class="admin-nav-icon" aria-hidden="true">⚙</span><span class="admin-nav-label">Profile &amp; security</span></button>
          </div>
        </nav>
        <div class="admin-sidebar-bottom">
          <span class="admin-connection-dot"></span>
          <span>Secure staff session</span>
        </div>
      </aside>

      <main class="admin-workspace">
        <header class="admin-topbar">
          <div class="admin-breadcrumb">Workspace <span>/</span> <strong id="breadcrumb-section">Overview</strong></div>
          <div class="admin-account">
            <span id="admin-avatar" class="admin-avatar">C</span>
            <span class="admin-account-copy"><strong id="admin-name">Admin</strong><small id="admin-role">Staff</small></span>
            <button id="admin-sign-out" class="admin-sign-out" type="button">Sign out</button>
          </div>
        </header>
        <section id="admin-content" class="admin-content" aria-live="polite">
          <div class="admin-loading"><span class="admin-spinner"></span> Verifying staff session…</div>
        </section>
      </main>
    </div>
  </body>
</html>
