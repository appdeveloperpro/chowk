<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffaf0">
    <title>Admin dashboard | CHOWK NEWS</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/admin.css">
    <script src="/category-icons.js" defer></script>
    <script src="/admin-dashboard.js" defer></script>
  </head>
  <body class="admin-dashboard-body">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <a class="admin-brand sidebar-brand" href="/admin/dashboard" aria-label="Chowk admin overview">
          <span class="admin-brand-mark">C</span>
          <span class="admin-brand-name">CHOWK<span>.</span><small>ADMIN CONSOLE</small></span>
        </a>
        <nav class="admin-nav" aria-label="Admin dashboard">
          <div class="admin-nav-group">
            <div class="admin-nav-heading">WORKSPACE</div>
            <button class="admin-nav-item is-active" type="button" data-section="overview"><span>◫</span> Overview</button>
          </div>
          <div class="admin-nav-group">
            <div class="admin-nav-heading">PUBLISHING</div>
            <button class="admin-nav-item" type="button" data-section="articles"><span>▤</span> Articles</button>
            <button class="admin-nav-item" type="button" data-section="categories"><span>◈</span> Categories</button>
            <button class="admin-nav-item" type="button" data-section="media"><span>▧</span> Media library</button>
            <button class="admin-nav-item" type="button" data-section="live-streams"><span>◉</span> Live streams</button>
            <button class="admin-nav-item" type="button" data-section="comments"><span>☷</span> Comments</button>
            <button class="admin-nav-item" type="button" data-section="reports"><span>⚑</span> News reports</button>
          </div>
          <div class="admin-nav-group">
            <div class="admin-nav-heading">PEOPLE & COVERAGE</div>
            <button class="admin-nav-item" type="button" data-section="users"><span>♙</span> Users</button>
            <button class="admin-nav-item" type="button" data-section="reporter-applications"><span>✎</span> Reporter applications</button>
            <button class="admin-nav-item" type="button" data-section="reporter-directory"><span>♙</span> Reporter directory</button>
            <button class="admin-nav-item" type="button" data-section="reporter-coverage"><span>⌖</span> Coverage assignments</button>
            <button class="admin-nav-item" type="button" data-section="reporter-credentials"><span>▣</span> Staff credentials</button>
            <button class="admin-nav-item" type="button" data-section="reporter-service-agreements"><span>▤</span> Service agreement</button>
            <button class="admin-nav-item" type="button" data-section="reporter-options"><span>⚑</span> Reporter setup</button>
            <button class="admin-nav-item" type="button" data-section="reporter-types"><span>♧</span> Reporter types</button>
          </div>
          <div class="admin-nav-group">
            <div class="admin-nav-heading">ADMINISTRATION</div>
            <button class="admin-nav-item" type="button" data-section="locations"><span>⌖</span> Locations</button>
            <button class="admin-nav-item" type="button" data-section="audit-logs"><span>◷</span> Audit log</button>
            <button class="admin-nav-item" type="button" data-section="settings"><span>⚙</span> Profile & security</button>
          </div>
        </nav>
        <div class="admin-sidebar-bottom">
          <span class="admin-connection-dot"></span>
          <span>Secure staff session</span>
        </div>
      </aside>

      <main class="admin-workspace">
        <header class="admin-topbar">
          <div class="admin-breadcrumb">Workspace <span>/</span> <strong id="breadcrumb-section">Overview</strong></div>
          <div class="admin-account">
            <span id="admin-avatar" class="admin-avatar">C</span>
            <span class="admin-account-copy"><strong id="admin-name">Admin</strong><small id="admin-role">Staff</small></span>
            <button id="admin-sign-out" class="admin-sign-out" type="button">Sign out</button>
          </div>
        </header>
        <section id="admin-content" class="admin-content" aria-live="polite">
          <div class="admin-loading"><span class="admin-spinner"></span> Verifying staff session…</div>
        </section>
      </main>
    </div>
  </body>
</html>
